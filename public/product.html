<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Stardust &amp; Stoneworks</title>
  <meta name="theme-color" content="#000000" />
  <link rel="icon" href="/brand/favicon.png" type="image/png" />
  <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header id="site-header" class="site-header"></header>

  <main>
    <div class="wrap">
      <nav class="crumbs" aria-label="Breadcrumb" id="crumbs"><a href="/shop">Shop</a></nav>
      <div id="productRoot" aria-busy="true">
        <div class="product">
          <div class="skeleton" style="aspect-ratio:1"></div>
          <div class="skeleton" style="aspect-ratio:auto;height:420px"></div>
        </div>
      </div>
    </div>

    <section class="section" id="relatedSection" hidden>
      <div class="wrap">
        <div class="section-head">
          <div class="reveal"><p class="eyebrow">Kindred stones</p><h2>You may also love</h2></div>
          <a href="/shop" class="link-arrow">Back to shop</a>
        </div>
        <div class="grid" id="related"></div>
      </div>
    </section>
  </main>

  <footer id="site-footer"></footer>
  <script src="/js/site.js"></script>
  <script src="/js/product.js"></script>
</body>
</html>
