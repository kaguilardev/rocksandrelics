<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Stardust &amp; Stoneworks · Crystals, Stones &amp; Minerals</title>
  <meta name="description" content="Stardust &amp; Stoneworks: every stone, crystal and rock you could want. Orbs, towers, carved figures, clusters and raw specimens." />
  <meta name="theme-color" content="#000000" />
  <meta property="og:image" content="/brand/logo-geode.png" />
  <link rel="icon" href="/brand/favicon.png" type="image/png" />
  <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body class="home">
  <header id="site-header" class="site-header"></header>

  <main class="home-screen">
    <div class="wrap home-grid">
      <div class="home-copy">
        <p class="eyebrow">Crystals · Stones · Minerals</p>
        <h1>Treasures pulled from the earth, <span class="accent">polished by starlight.</span></h1>
        <p class="lede">Orbs, towers, carved figures, clusters and raw specimens, every one chosen by hand and photographed exactly as it is.</p>
        <div class="cta-row">
          <a href="/shop" class="btn btn-primary">Explore the shop</a>
          <a href="/about" class="btn btn-ghost">Our story</a>
        </div>
      </div>

      <div class="hero-stage" aria-hidden="true">
        <span class="halo"></span>
        <span class="ring"></span>
        <span class="ring r2"></span>
        <div class="hero-logo" id="heroLogo"><img src="/brand/logo-hero.png" alt="" width="428" height="362" /></div>
        <span class="sparkle" style="top:14%;left:18%">✦</span>
        <span class="sparkle" style="top:22%;right:12%;animation-delay:1.1s;font-size:.75rem">✦</span>
        <span class="sparkle" style="bottom:20%;left:10%;animation-delay:2s;font-size:.7rem;color:var(--teal)">✦</span>
        <span class="sparkle" style="bottom:12%;right:22%;animation-delay:.6s">✦</span>
      </div>

      <nav class="form-strip" id="formStrip" aria-label="Shop by form"></nav>
    </div>
    <div class="wrap home-foot">
      <span>© <span id="year"></span> Stardust &amp; Stoneworks</span>
      <a href="/contact">Contact</a>
      <a href="/admin">Staff login</a>
    </div>
  </main>

  <script src="/js/site.js"></script>
  <script src="/js/home.js"></script>
</body>
</html>
