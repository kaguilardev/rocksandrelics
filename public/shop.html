<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Shop · Stardust &amp; Stoneworks</title>
  <meta name="description" content="Shop crystals, orbs, towers, carved figures, clusters and raw stones at Stardust &amp; Stoneworks." />
  <meta name="theme-color" content="#000000" />
  <link rel="icon" href="/brand/favicon.png" type="image/png" />
  <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header id="site-header" class="site-header"></header>

  <main>
    <section class="page-head">
      <div class="wrap">
        <p class="eyebrow reveal">The shop</p>
        <h1 class="reveal reveal-d1" id="shopTitle">Every stone, <span class="accent">every form.</span></h1>
        <p class="lede reveal reveal-d2">Filter by shape, search by stone, and find the piece that's been waiting for you.</p>
      </div>
    </section>

    <div class="wrap shop-layout">
      <aside class="filters" id="filters" aria-label="Filters">
        <div class="filter-group">
          <h4>Search</h4>
          <label class="sr-only" for="q">Search stones</label>
          <input class="field" id="q" type="search" placeholder="Amethyst, moon, heart…" />
        </div>
        <div class="filter-group">
          <h4>Form</h4>
          <div class="form-list" id="formList"></div>
        </div>
        <div class="filter-group">
          <h4>Sort</h4>
          <label class="sr-only" for="sort">Sort by</label>
          <select class="field" id="sort">
            <option value="new">Newest</option>
            <option value="low">Price: low to high</option>
            <option value="high">Price: high to low</option>
            <option value="name">Name A–Z</option>
          </select>
        </div>
        <label class="check"><input type="checkbox" id="inStock" /> In stock only</label>
      </aside>

      <div>
        <div class="results-bar">
          <span id="resultCount" aria-live="polite"></span>
          <button class="btn btn-ghost filter-toggle" type="button" id="filterToggle" aria-expanded="false" aria-controls="filters">Filters</button>
        </div>
        <div class="grid" id="grid" aria-busy="true"></div>
      </div>
    </div>
  </main>

  <footer id="site-footer"></footer>
  <script src="/js/site.js"></script>
  <script src="/js/shop.js"></script>
</body>
</html>
